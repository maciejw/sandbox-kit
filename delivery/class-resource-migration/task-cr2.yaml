task_id: cr2-powershell-stage-wiring
feature_id: sandboxkit-class-resource-migration
objective: Wire the development-powershell image stage and fast test harness to the SandboxKit class module without changing the canonical Bash-backed image.
requirement_ids:
  - CR-STAGE
  - CR-EVIDENCE
requirement_excerpt:
  CR-STAGE: The PowerShell stage discovers the module directly and no longer relies on old PowerShell command manifests for resource discovery.
  CR-EVIDENCE: Stage wiring and existing bootstrap checks have focused automated evidence.
contract_ref:
  path: D:\sandbox-kit\CLASS-RESOURCE-MIGRATION-PLAN.md
  sections:
    - Active phase: class resources
    - Invariants and non-goals for phase 1
    - Acceptance criteria
  digest: 16D64F119031C89C03503B537E7648F9A3E749458D051E71AB87BFCE1D6A9EAE
workspace_root: D:\sandbox-kit
write_owner: feature_implementer
write_boundary:
  - D:\sandbox-kit\docker-sbx-almalinux9\Dockerfile
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\test-powershell.ps1
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\dev-bootstrap.ps1
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\dev-bootstrap
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\tests\Bootstrap.Tests.ps1
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\README.md
read_context:
  - path: D:\sandbox-kit\delivery\class-resource-migration\task-cr1.yaml
    purpose: CR-1 module artifact and class-test contract.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\Dockerfile
    purpose: Current development-runtime and development-powershell copy/path stages.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\test-powershell.ps1
    purpose: Current disposable Pester harness and staged file list.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\dev-bootstrap.ps1
    purpose: Current DSC driver and resource path setup.
current_state:
  - PowerShell stage copies command manifests/scripts into a resource directory.
  - The fast harness stages those command files and runs existing Pester tests.
required_changes:
  - Copy/install the SandboxKit module into a discoverable PSModulePath location.
  - Stop staging the old PowerShell command manifests/scripts into the class-stage resource path.
  - Update the driver/test harness to expose the module and run class-resource documents.
  - Adjust existing bootstrap tests to assert class discovery and class-config shape instead of command-manifest internals.
must_preserve:
  - Do not modify the canonical `development` Bash stage or `bootstrap/resources`.
  - Do not modify CR-1 module implementation files.
  - Preserve DSC/PowerShell version pins and existing image user/permission behavior.
  - Preserve system/tools desired-state documents and public type names.
non_goals:
  - Deleting Bash resources.
  - Creating base/resources/configuration/final folders.
  - Running or publishing a final image from the implementer.
prerequisites:
  - CR-1 accepted and module path present.
  - Existing Dockerfile and test harness remain readable.
dependency_edges:
  - CR-1 must complete before CR-2.
verification:
  commands:
    - id: cr2-pester
      cwd: D:\sandbox-kit
      command: pwsh -NoLogo -NoProfile -Command 'Import-Module Pester; $c=New-PesterConfiguration; $c.TestDrive.Enabled=$false; $c.TestRegistry.Enabled=$false; $c.Output.Verbosity="Detailed"; $c.Run.Path="./docker-sbx-almalinux9/bootstrap/ps/tests/Bootstrap.Tests.ps1"; Invoke-Pester -Configuration $c'
  required_tests:
    - Stage copy/path assertions.
    - Class module discovery assertions.
    - Existing system/tools document contract assertions.
  manual_handoff:
    - Main agent performs Linux image/sandbox DSC smoke verification.
baseline:
  kind: manifest
  value: D:\sandbox-kit\delivery\class-resource-migration\baseline.json
  digest: D36FC3FAEE97DCE290DB01A7199443CDA748D7748DCDB02573F538BF4861DCBA
permissions:
  allowed_side_effects:
    - Workspace edits limited to the declared write boundary.
    - Local PowerShell/Pester test outputs.
  forbidden_side_effects:
    - Image builds, package installation, publication, or destructive cleanup.
completion_when:
  - PowerShell stage no longer stages old command manifests for resource discovery.
  - Module path wiring is explicit and test-covered.
  - Required Pester tests pass.
  - No canonical Bash-stage files are changed.
stop_and_report_when:
  - CR-1 module paths or public types do not match the packet.
  - Stage wiring would require changing the canonical Bash image.
  - Required test prerequisites are unavailable.
