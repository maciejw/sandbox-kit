feature_id: sandboxkit-class-resource-migration
objective: Convert the three PowerShell-backed bootstrap resources to native DSC class resources while preserving their public contracts and current safety behavior.
contract_ref:
  path: D:\sandbox-kit\CLASS-RESOURCE-MIGRATION-PLAN.md
  sections:
    - Requirements contract
    - Active phase: class resources
    - Invariants and non-goals for phase 1
    - Acceptance criteria
  digest: 16D64F119031C89C03503B537E7648F9A3E749458D051E71AB87BFCE1D6A9EAE
requirements:
  - id: CR-RESOURCES
    behavior: SandboxKit/DnfPackagePresent, SandboxKit/HttpTool, and SandboxKit/ProfileConfiguration are discoverable as PowerShell class resources with Get/Test/Set behavior.
  - id: CR-CONTRACTS
    behavior: Existing desired-state property names, tool/profile/package semantics, safety checks, and root/non-root rules remain behaviorally equivalent.
  - id: CR-STAGE
    behavior: The development-powershell stage discovers the module directly and no longer relies on the old PowerShell command manifests for its DSC resource path.
  - id: CR-EVIDENCE
    behavior: Focused Pester evidence exists for discovery, schema/property parity, validation, idempotence, and the stage wiring; Linux DSC smoke verification is handed to the main agent.
non_goals:
  - Bash resource removal and canonical development-image migration
  - base/resources/configuration/final folder reorganization
  - Go POC migration
  - YAML configuration
  - package upgrade/removal semantics
invariants:
  - Public resource type names remain unchanged.
  - Existing Bash-backed development image remains untouched in phase 1.
  - Profile sourceDirectory/revision input remains unchanged in phase 1.
workspace:
  roots:
    - D:\sandbox-kit
  dirty_state: Preserve all existing user and agent changes; no repository reset or broad cleanup.
dependencies:
  - Existing DNF class-resource POC discovery pattern
  - PowerShell 7 and DSC 3.3 runtime in development-powershell stage
  - Pester test stage
permissions:
  allowed:
    - Read and edit the bounded phase-1 files.
    - Run local PowerShell/Pester verification.
  retained_by_main_agent:
    - Podman image builds and Linux sandbox smoke tests
    - Any package installation, publication, or destructive cleanup
acceptance:
  automated:
    - Module and class discovery tests pass.
    - Focused Pester tests pass for each class resource and stage wiring.
    - Existing required behavior tests have class-resource replacements.
  manual:
    - Main agent runs Linux DSC 3.3 get/test/set smoke checks in the PowerShell stage when the runtime is available.
quality_profile: high_risk
plan_evidence: D:\sandbox-kit\CLASS-RESOURCE-MIGRATION-PLAN.md; scope=within_scope; readiness=ready_with_assumptions
