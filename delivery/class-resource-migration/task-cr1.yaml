task_id: cr1-sandboxkit-class-module
feature_id: sandboxkit-class-resource-migration
objective: Implement and test the SandboxKit PowerShell module containing DnfPackagePresent, HttpTool, and ProfileConfiguration class resources.
requirement_ids:
  - CR-RESOURCES
  - CR-CONTRACTS
  - CR-EVIDENCE
requirement_excerpt:
  CR-RESOURCES: All three logical resources are discoverable as PowerShell class resources and implement Get/Test/Set.
  CR-CONTRACTS: Preserve current property names, convergence, safety, and ownership behavior.
  CR-EVIDENCE: Add focused Pester tests that prove discovery and meaningful behavior.
contract_ref:
  path: D:\sandbox-kit\CLASS-RESOURCE-MIGRATION-PLAN.md
  sections:
    - Active phase: class resources
    - Invariants and non-goals for phase 1
    - Acceptance criteria
  digest: 16D64F119031C89C03503B537E7648F9A3E749458D051E71AB87BFCE1D6A9EAE
workspace_root: D:\sandbox-kit
write_owner: feature_implementer
write_boundary:
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\module\SandboxKit\
  - D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\tests\ClassResources.Tests.ps1
read_context:
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\poc\SandboxKit.DnfClassPoc\SandboxKit.DnfClassPoc.psm1
    purpose: Existing class-resource discovery and DNF behavior proof.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\package.ps1
    purpose: Package behavior and checksum/root contract.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\tool.ps1
    purpose: Tool integrity, archive containment, link, lock, and installation behavior.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\user.ps1
    purpose: Profile backup, revision, source safety, and ownership behavior.
  - path: D:\sandbox-kit\docker-sbx-almalinux9\bootstrap\ps\tests\Bootstrap.Tests.ps1
    purpose: Existing assertions that must be replaced or preserved by class-focused tests.
current_state:
  - Production PS resources are command manifests and scripts.
  - DNF class behavior exists only under the isolated POC type.
required_changes:
  - Create a versioned SandboxKit module manifest and module implementation in the write boundary.
  - Define one DscResource class per logical resource with typed DscProperty attributes.
  - Move shared mechanics into private module helpers only where behavior is genuinely shared.
  - Add tests for module discovery, property metadata, invalid input, idempotent set, and safety invariants.
must_preserve:
  - Do not edit or delete the Bash resources.
  - Do not edit the Dockerfile or stage harness.
  - Do not change public type/property names or tool URLs/checksums.
  - Keep ProfileConfiguration sourceDirectory/revision input in this phase.
non_goals:
  - Image wiring
  - Folder/artifact reorganization
  - Removing temporary profile document generation
prerequisites:
  - PowerShell 7 and Pester available on the host, or use the existing test-stage patterns.
dependency_edges:
  - Existing POC establishes class-resource shape.
verification:
  commands:
    - id: cr1-pester
      cwd: D:\sandbox-kit
      command: pwsh -NoLogo -NoProfile -Command 'Import-Module Pester; $c=New-PesterConfiguration; $c.TestDrive.Enabled=$false; $c.TestRegistry.Enabled=$false; $c.Output.Verbosity="Detailed"; $c.Run.Path="./docker-sbx-almalinux9/bootstrap/ps/tests/ClassResources.Tests.ps1"; Invoke-Pester -Configuration $c'
  required_tests:
    - Module manifest validation.
    - Get-DscResource reports all three resources as ClassBased/PowerShell.
    - Behavioral tests cover get/test/set convergence and rejection paths.
  manual_handoff:
    - Main agent runs Linux DSC 3.3 smoke tests after CR-2 wiring.
baseline:
  kind: manifest
  value: D:\sandbox-kit\delivery\class-resource-migration\baseline.json
  digest: D36FC3FAEE97DCE290DB01A7199443CDA748D7748DCDB02573F538BF4861DCBA
permissions:
  allowed_side_effects:
    - Workspace edits limited to the declared write boundary.
    - Local PowerShell/Pester test outputs.
  forbidden_side_effects:
    - Image builds, package installation, publication, or deletion outside the write boundary.
completion_when:
  - SandboxKit module imports successfully.
  - All three class resources are discoverable.
  - Required Pester tests pass.
  - No files outside the write boundary are changed.
stop_and_report_when:
  - The existing behavior cannot be represented without changing the public contract.
  - A safety invariant requires a user decision.
  - Required PowerShell/Pester prerequisites are unavailable.
