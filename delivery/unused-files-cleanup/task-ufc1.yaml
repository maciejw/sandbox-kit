task_id: ufc1-delete-unused-sources
feature_id: unused-files-cleanup
objective: Delete the exact superseded source set, reconcile its four live references, and prove active implementations are unchanged.
requirement_ids:
  - UFC-DELETE
  - UFC-REFERENCES
  - UFC-PRESERVE
  - UFC-VERIFY
requirement_excerpt:
  UFC-DELETE: Exactly the 23 manifest-backed legacy PowerShell and POC files are absent; no other source file is removed.
  UFC-REFERENCES: Live architecture, bootstrap documentation, driver commentary, and structural tests describe the class implementation and contain no positive dependency on removed sources.
  UFC-PRESERVE: Active Bash resources, canonical Bash stage, SandboxKit class module, DSC documents, historical evidence, and all out-of-bound workspace content remain unchanged.
  UFC-VERIFY: Parsing, focused host Pester, exact hash checks, and the disposable AlmaLinux class-stage harness pass.
