current_state:
  - The class stage already excludes legacy PowerShell command resources.
  - All POC trees are disconnected from both image stages.
  - Live documentation still describes the POCs and pre-class implementation model.
  - Active Bash resources remain required by the canonical development stage.
required_changes:
  - Before deletion, compare every baseline.delete file hash and stop on any mismatch.
  - Delete exactly all baseline.delete files using apply_patch; remove only resulting empty directories with explicit non-recursive operations.
  - Update DSC-ARCHITECTURE.md to describe the current native PowerShell class module, remove the deleted POC sections, and keep Go migration deferred.
  - Remove the POC paragraph from bootstrap/README.md while preserving active Bash and class-resource instructions.
  - Generalize the legacy Common.ps1 comment in ps/dev-bootstrap.ps1 without changing executable behavior.
  - Add one focused Bootstrap.Tests.ps1 test named "does not retain superseded PowerShell command resources or POC trees" that asserts all legacy file paths and POC roots are absent.
must_preserve:
  - Every baseline.preserve file byte-for-byte.
  - Dockerfile and both active image stage behaviors.
  - ClassResources.Tests.ps1 and SandboxKit module byte-for-byte.
  - Historical plan and delivery evidence content.
  - Unrelated workspace changes; do not reset, restore, or broadly clean.
non_goals:
  - Dockerfile cleanup or path/copy pruning.
  - Bash retirement or final artifact reorganization.
  - Runtime implementation, schema, version, checksum, or configuration changes.
prerequisites:
  - Confirmed user authorization recorded in the contract.
  - All baseline.delete hashes match before deletion.
dependency_edges: []
verification:
  commands:
    - id: ufc1-reference
      cwd: D:\sandbox-kit
      command: rg -n "bootstrap/(ps/poc|go/poc|poc/)|Common\.ps1|PackageInput\.ps1|package\.ps1|tool\.ps1|user\.ps1" docker-sbx-almalinux9 -g "!bootstrap/ps/tests/Bootstrap.Tests.ps1"
    - id: ufc1-parse
      cwd: D:\sandbox-kit
      command: pwsh -NoLogo -NoProfile -Command "$files=@('./docker-sbx-almalinux9/bootstrap/ps/dev-bootstrap.ps1','./docker-sbx-almalinux9/bootstrap/ps/tests/Bootstrap.Tests.ps1'); foreach($file in $files){$tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors;exit 1}}"
    - id: ufc1-pester
      cwd: D:\sandbox-kit
      command: pwsh -NoLogo -NoProfile -Command "$c=New-PesterConfiguration;$c.TestDrive.Enabled=$false;$c.TestRegistry.Enabled=$false;$c.Output.Verbosity='Detailed';$c.Run.Path=@('./docker-sbx-almalinux9/bootstrap/ps/tests/ClassResources.Tests.ps1','./docker-sbx-almalinux9/bootstrap/ps/tests/Bootstrap.Tests.ps1');Invoke-Pester -Configuration $c"
  required_tests:
    - Bootstrap.Tests.ps1 includes and passes "does not retain superseded PowerShell command resources or POC trees" with concrete absence assertions for all four target groups.
    - Existing class discovery, direct syntax, property contract, Bash-stage preservation, and launcher tests remain enabled and pass.
  manual_handoff:
    - Main agent runs the disposable AlmaLinux test-powershell.ps1 harness.
baseline:
  kind: manifest
  value: D:\sandbox-kit\delivery\unused-files-cleanup\baseline.json
  digest: FF46132876CC41AB4746270C583266DB4F2D9E86988DBEABC40214009DED6981
permissions:
  allowed_side_effects:
    - Delete only baseline.delete entries after exact hash validation.
    - Edit only declared write-boundary documentation, comment, and test files.
    - Remove exact empty directories left by those deletions without recursion.
  forbidden_side_effects:
    - Image, package, sandbox, registry, or network mutations.
    - Recursive deletion, Git cleanup/reset/restore, or edits outside the write boundary.
completion_when:
  - All baseline.delete paths are absent and all baseline.preserve hashes match.
  - Reference and parse checks pass.
  - Focused Pester suite passes with the required exact test.
  - Implementation evidence packet is complete and reproducible.
stop_and_report_when:
  - Any baseline.delete hash differs before deletion.
  - Any requested edit requires a file outside the write boundary.
  - A preserved artifact changes or a required test cannot be retained.
