---
- name: Ensure the developer profile repository clone
  hosts: sandbox
  gather_facts: false
  vars:
    profile_target: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    profile_clone_path: "{{ profile_target }}/.dotfiles"
    profile_repository_origin: "{{ 'file://' ~ (profile_repository | urlencode) }}"
  tasks:
    - name: Inspect the existing dotfiles path
      ansible.builtin.stat:
        path: "{{ profile_clone_path }}"
      register: profile_clone_status

    - name: Refuse a non-directory dotfiles path
      ansible.builtin.assert:
        that:
          - profile_clone_status.stat.isdir
        fail_msg: "{{ profile_clone_path }} exists but is not a directory; leaving it untouched."
      when: profile_clone_status.stat.exists

    - name: Resolve the existing dotfiles path without changing it
      ansible.builtin.command:
        argv:
          - realpath
          - -e
          - "{{ profile_clone_path }}"
      register: profile_clone_resolved_path
      changed_when: false
      failed_when: false
      when: profile_clone_status.stat.exists

    - name: Read the existing Git worktree root without changing it
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ profile_clone_path }}"
          - rev-parse
          - --show-toplevel
      register: profile_clone_root
      changed_when: false
      failed_when: false
      when: profile_clone_status.stat.exists

    - name: Refuse a path nested below another Git checkout
      ansible.builtin.assert:
        that:
          - profile_clone_resolved_path.rc == 0
          - profile_clone_root.rc == 0
          - (profile_clone_root.stdout | trim) == (profile_clone_resolved_path.stdout | trim)
        fail_msg: "{{ profile_clone_path }} is not the root of a Git checkout; leaving it untouched."
      when: profile_clone_status.stat.exists

    - name: Read the existing clone origin without updating it
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ profile_clone_path }}"
          - remote
          - get-url
          - origin
      register: profile_clone_origin
      changed_when: false
      failed_when: false
      when: profile_clone_status.stat.exists

    - name: Refuse a checkout from another repository
      ansible.builtin.assert:
        that:
          - profile_clone_origin.rc == 0
          - profile_clone_origin.stdout | trim in [profile_repository, profile_repository_origin]
        fail_msg: "{{ profile_clone_path }} is not a clone of {{ profile_repository }}; leaving it untouched."
      when: profile_clone_status.stat.exists

    # The mounted source's current HEAD is the desired initial snapshot; later
    # runs never invoke this task for an existing clone.
    - name: Clone the repository into the agent home when absent  # noqa: latest[git]
      ansible.builtin.git:
        repo: "{{ profile_repository_origin }}"
        dest: "{{ profile_clone_path }}"
        version: HEAD
        update: false
        force: false
      when: not profile_clone_status.stat.exists
